<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>روابط — تمام للتقنية</title>
    <!-- استدعاء خط ألكسندریا وأيقونات Font Awesome الشهيرة -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">

    <style>
        /* إعدادات المتغيرات والألوان النيونية والتقنية المريحة للعين */
        :root {
            --bg-dark: #0a0b10;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary-neon: #00f2fe;
            --secondary-neon: #4facfe;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        /* تصفير الإعدادات الافتراضية للخطوط والهوامش */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Alexandria', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            position: relative;
            text-align: center;
            min-height: 100vh;
        }

        /* شبكة النيون المتحركة في الخلفية عبر الـ Canvas */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.25;
            pointer-events: none;
        }

        /* شريط التنقل الزجاجي المرن والمتوافق مع الأجهزة */
        nav {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            padding: 1.2rem 5%;
            background: rgba(10, 11, 16, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            z-index: 100;
            gap: 15px;
        }

        nav a {
            color: var(--text-main);
            text-decoration: none;
            margin: 0 10px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: 0.3s ease;
            padding: 4px 0;
            border-bottom: 2px solid transparent;
        }

        nav a:hover, nav a.active {
            color: var(--primary-neon);
            border-bottom: 2px solid var(--primary-neon);
        }

        /* حاوية المحتوى الرئيسية الوسطية */
        .main-content {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        .container {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
        }

        /* إعدادات اللوجو المتحرك (فيديو) الموحد */
        .avatar-video {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary-neon);
            margin-bottom: 25px;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.25);
            animation: float 4s ease-in-out infinite;
            background-color: #0d0f14;
            display: inline-block;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary-neon), var(--secondary-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .bio {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 25px;
            font-weight: 400;
        }

        .line {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-neon), var(--secondary-neon));
            margin: 0 auto 35px;
            border-radius: 10px;
        }

        /* حاوية الأزرار العمودية الصارمة باستخدام Flex */
        .links {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }

        /* تصميم أزرار الروابط الزجاجية بدون أي اختفاء برميجي مسبق لضمان العمل التام */
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 16px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            width: 100%;
        }

        .link-btn i {
            font-size: 1.4rem;
            transition: transform 0.2s ease;
        }

        /* تأثير التكبير الطفيف للأيقونات عند التحويم */
        .link-btn:hover i {
            transform: scale(1.2);
        }

        /* 🌈 تأثيرات توهج نيونية ثابتة واحترافية عند التحويم بكل شبكة 🌈 */
        .link-whatsapp:hover {
            border-color: #25D366;
            box-shadow: 0 0 20px rgba(37, 211, 102, 0.3);
            color: #25D366;
            background: rgba(37, 211, 102, 0.02);
        }
        .link-instagram:hover {
            border-color: #E1306C;
            box-shadow: 0 0 20px rgba(225, 48, 108, 0.3);
            color: #E1306C;
            background: rgba(225, 48, 108, 0.02);
        }
        .link-facebook:hover {
            border-color: #1877F2;
            box-shadow: 0 0 20px rgba(24, 119, 242, 0.3);
            color: #1877F2;
            background: rgba(24, 119, 242, 0.02);
        }
        .link-telegram:hover {
            border-color: #0088cc;
            box-shadow: 0 0 20px rgba(0, 136, 204, 0.3);
            color: #0088cc;
            background: rgba(0, 136, 204, 0.02);
        }
        .link-youtube:hover {
            border-color: #FF0000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
            color: #FF0000;
            background: rgba(255, 0, 0, 0.02);
        }
        .link-globe:hover, .link-user:hover {
            border-color: var(--primary-neon);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
            color: var(--primary-neon);
            background: rgba(0, 242, 254, 0.02);
        }

        /* تذييل الصفحة */
        .footer {
            margin-top: 50px;
            font-size: 0.9rem;
            color: var(--text-muted);
            padding: 20px 0;
            border-top: 1px solid var(--card-border);
            width: 100%;
        }
        .footer span {
            color: var(--primary-neon);
            font-weight: 600;
        }

        /* تجاوب تام وسلس مع الهواتف الذكية */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .link-btn { padding: 14px 20px; font-size: 1rem; }
            nav { padding: 1rem; gap: 10px; }
            nav a { margin: 0 6px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <!-- شريط التنقل المتكامل المتناسق برمجياً -->
    <nav>

    <div class="main-content">

            <video autoplay loop muted playsinline class="avatar-video">

            <div class="links">

                <a href="https://wa.me" target="_blank" class="link-btn link-whatsapp">

                </a>
                <!-- إنستغرام -->
                <a href="https://instagram.com" target="_blank" class="link-btn link-instagram">
                    <i class="fa-brands fa-instagram"></i> إنستغرام
                </a>
                <!-- فيسبوك -->
                <a href="https://facebook.com" target="_blank" class="link-btn link-facebook">

                <a href="https://t.me" target="_blank" class="link-btn link-telegram">
