<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة تحميل كتب - تمام للتقنية</title>
    <style>
        @import url('https://googleapis.com');

        body {
            background-color: #1a1a1a;
            font-family: 'Cairo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* حاوية البطاقة */
        .book-card {
            background: #262626;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 300px;
            padding: 20px;
            text-align: center;
            color: #ffffff;
            border: 1px solid #333;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        /* تأثير التوهج عند تمرير الماوس */
        .book-card:hover {
            transform: translateY(-10px);
            border-color: #ffb703;
            box-shadow: 0 15px 35px rgba(255, 183, 3, 0.2);
        }

        /* أيقونة التخصص */
        .tech-icon {
            font-size: 40px;
            color: #ffb703;
            margin-bottom: 15px;
        }

        /* عنوان الكتاب */
        .book-title {
            font-size: 20px;
            font-weight: 700;
            margin: 10px 0;
            color: #ffffff;
        }

        /* وصف الكتاب */
        .book-desc {
            font-size: 14px;
            color: #b3b3b3;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        /* تصنيف المادة (كهرباء أو ميكانيك) */
        .badge {
            background-color: rgba(255, 183, 3, 0.1);
            color: #ffb703;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 15px;
            font-weight: bold;
        }

        /* زر التحميل التفاعلي */
        .download-btn {
            background: linear-gradient(45deg, #ffb703, #fb8500);
            color: #000;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s ease, transform 0.2s ease;
            text-decoration: none;
            display: block;
            box-shadow: 0 4px 15px rgba(253, 133, 0, 0.3);
        }

        .download-btn:hover {
            transform: scale(1.02);
            background: linear-gradient(45deg, #fb8500, #ffb703);
        }
    </style>
</head>
<body>

    <!-- بطاقة كتاب كمثال -->
    <div class="book-card">
        <div class="tech-icon">⚙️⚡</div>
        <span class="badge">الثالث الثانوي المهني</span>
        <h3 class="book-title">كتاب كهرباء وميكانيك السيارات</h3>
        <p class="book-desc">يحتوي هذا الكتاب على شرح مفصل لأنظمة المحركات الحديثة، الحساسات، والدوائر الكهربائية التشخيصية للسيارات.</p>
        <a href="#" class="download-btn">تحميل الكتاب (PDF)</a>
    </div>

</body>
</html>
