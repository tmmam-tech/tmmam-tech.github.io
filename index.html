<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تمام للتقنية | tmmam tech</title>
    <style>
        @import url('https://googleapis.com');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #060b13; /* خلفية زرقاء داكنة جداً ذات طابع تقني */
            color: #e2e8f0;
            font-family: 'Cairo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(circle at top right, rgba(0, 168, 204, 0.15), transparent 450px);
        }

        /* الحاوية الرئيسية بطابع زجاجي حديث */
        .main-container {
            background: rgba(10, 20, 38, 0.65);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 168, 204, 0.2);
            border-radius: 24px;
            max-width: 650px;
            width: 100%;
            padding: 50px 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        /* حاوية الفيديو المتحرك */
        .logo-box {
            margin-bottom: 25px;
            position: relative;
            display: inline-block;
        }

        /* تنسيق فيديو اللوجو مع هالة إضاءة زرقاء */
        .brand-video {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #00a8cc;
            box-shadow: 0 0 25px rgba(0, 168, 204, 0.4);
            animation: float 4s ease-in-out infinite;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .brand-video:hover {
            transform: scale(1.06);
            box-shadow: 0 0 35px rgba(0, 168, 204, 0.7);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 2.6rem;
            color: #ffffff;
            margin-bottom: 5px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #00a8cc;
            margin-bottom: 20px;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .line {
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #00a8cc, transparent);
            margin: 0 auto 30px;
            border-radius: 2px;
        }

        .description {
            font-size: 1.2rem;
            color: #cbd5e1;
            margin-bottom: 18px;
            line-height: 1.8;
            font-weight: 400;
        }

        .highlight {
            color: #00a8cc;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(0, 168, 204, 0.3);
        }

        /* حاوية الأزرار لتنسيقها بشكل مرن */
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 35px;
        }

        /* تصميم الأزرار الزرقاء المستقبلية */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 168, 204, 0.05);
            border: 1.5px solid rgba(0, 168, 204, 0.4);
            color: #ffffff;
            padding: 12px 28px;
            font-size: 1rem;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            gap: 8px;
        }

        .btn:hover {
            background: #00a8cc;
            color: #060b13;
            box-shadow: 0 0 20px rgba(0, 168, 204, 0.4);
            transform: translateY(-2px);
            border-color: #00a8cc;
        }

        /* زر المكتبة المميز بتأثير النبض لحذب الطلاب */
        .btn-prime {
            background: linear-gradient(45deg, #00a8cc, #007799);
            border: none;
            color: #060b13;
            animation: pulse 2s infinite;
        }

        .btn-prime:hover {
            background: linear-gradient(45deg, #00c3eb, #002233);
            color: #ffffff;
            box-shadow: 0 0 25px rgba(0, 168, 204, 0.6);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 168, 204, 0.5); }
            70% { box-shadow: 0 0 0 15px rgba(0, 168, 204, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 168, 204, 0); }
        }

        /* شارة "جديد" المضيئة داخل الأزرار */
        .badge {
            background: #ffffff;
            color: #060b13;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 12px;
            margin-right: 5px;
        }

        .footer {
            margin-top: 45px;
            font-size: 0.85rem;
            color: #64748b;
        }

        .footer span {
            color: #00a8cc;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <!-- قسم اللوجو الفيديو المتحرك الخاص بموقعك -->
        <div class="logo-box">
            <video class="brand-video" autoplay loop muted playsinline>
                <source src="tech-logo.mp4" type="video/mp4">
                المتصفح لا يدعم تشغيل الفيديو.
            </video>
        </div>

        <h1>تمام للتقنية</h1>
        <div class="subtitle">tmmam tech</div>
        <div class="line"></div>
        
        <p class="description">
            رحلة شغف وإبداع تدمج بين عالم التقنية الرقمية وهندسة السيارات.
        </p>
        <p class="description">
            هنا تجدون شروحات <span class="highlight">ميكانيك وكهرباء السيارات</span>، البرامج الحديثة، والملخصات الحصرية لطلابنا.
        </p>
        
        <!-- مجموعة الأزرار المحدثة بالتصميم التفاعلي الأزرق -->
        <div class="btn-group">
            <a href="about.html" class="btn">👤 من أنا؟</a>
            
            <a href="education.html" class="btn btn-prime">
                📚 المكتبة والملخصات
            </a>

            <a href="links.html" class="btn">
                🔗 روابط التواصل
                <span class="badge">جديد</span>
            </a>
        </div>
        
        <div class="footer">
            تصميم وتطوير — <span>tmmam تمام ❤️</span>
        </div>
    </div>

</body>
</html>
