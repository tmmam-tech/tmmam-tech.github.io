<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تمام للتقنية | tmmam tech</title>
    <style>
        @import url('https://googleapis.com');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #060b13; 
            color: #e2e8f0;
            font-family: 'Cairo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(circle at top right, rgba(0, 168, 204, 0.15), transparent 450px);
        }

        /* الحاوية الرئيسية: ستكون مرنة وتتحول لشكل عرضي على الشاشات الكبيرة */
        .main-container {
            background: rgba(10, 20, 38, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 168, 204, 0.2);
            border-radius: 24px;
            max-width: 850px;
            width: 100%;
            padding: 40px;
            display: flex;
            flex-direction: column; /* عمودي افتراضياً للموبايل */
            align-items: center;
            gap: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease-in-out;
        }

        /* محتوى النصوص */
        .content-box {
            text-align: center;
            width: 100%;
        }

        /* حاوية الفيديو */
        .logo-box {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        /* تنسيق الفيديو مع حل مشكلة التشغيل التلقائي */
        .brand-video {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #00a8cc;
            box-shadow: 0 0 25px rgba(0, 168, 204, 0.4);
            animation: float 4s ease-in-out infinite;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .brand-video:hover {
            transform: scale(1.06);
            box-shadow: 0 0 35px rgba(0, 168, 204, 0.7);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 2.4rem;
            color: #ffffff;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #00a8cc;
            margin-bottom: 15px;
            font-weight: 400;
        }

        .line {
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #00a8cc, transparent);
            margin: 0 auto 25px;
            border-radius: 2px;
        }

        .description {
            font-size: 1.1rem;
            color: #cbd5e1;
            margin-bottom: 15px;
            line-height: 1.8;
        }

        .highlight {
            color: #00a8cc;
            font-weight: 600;
        }

        /* حاوية الأزرار المتجاوبة */
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 168, 204, 0.05);
            border: 1.5px solid rgba(0, 168, 204, 0.4);
            color: #ffffff;
            padding: 10px 24px;
            font-size: 0.95rem;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #00a8cc;
            color: #060b13;
            box-shadow: 0 0 20px rgba(0, 168, 204, 0.4);
            transform: translateY(-2px);
        }

        .btn-prime {
            background: linear-gradient(45deg, #00a8cc, #007799);
            border: none;
            color: #060b13;
            animation: pulse 2s infinite;
        }

        .btn-prime:hover {
            background: linear-gradient(45deg, #00c3eb, #002233);
            color: #ffffff;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 168, 204, 0.5); }
            70% { box-shadow: 0 0 0 12px rgba(0, 168, 204, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 168, 204, 0); }
        }

        .badge {
            background: #ffffff;
            color: #060b13;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 12px;
            margin-right: 5px;
        }

        .footer {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #64748b;
            width: 100%;
        }

        .footer span {
            color: #00a8cc;
        }

        /* 🖥️ شاشات الكمبيوتر الكبيرة: تحويل التصميم إلى عرضي احترافي */
        @media (min-width: 768px) {
            .main-container {
                flex-direction: row-reverse; /* اللوجو يمين والنصوص يسار بالتناسق العربي */
                text-align: right;
                padding: 50px;
                align-items: center;
            }
            .content-box {
                text-align: right;
            }
            .line {
                margin: 0 0 25px 0; /* محاذاة الخط لليمين */
            }
            .btn-group {
                justify-content: flex-start; /* محاذاة الأزرار لليمين */
            }
            .footer {
                text-align: center;
                position: absolute;
                bottom: 20px;
                left: 0;
                right: 0;
            }
            .brand-video {
                width: 200px; /* تكبير اللوجو قليلاً على شاشات الكمبيوتر */
                height: 200px;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <!-- قسم اللوجو الفيديو (تمت إضافة خصائص صارمة للتشغيل التلقائي المستمر) -->
        <div class="logo-box">
            <video class="brand-video" autoplay loop muted playsinline webkit-playsinline preload="auto">
                <source src="tech-logo.mp4" type="video/mp4">
                المتصفح لا يدعم تشغيل الفيديو.
            </video>
        </div>

        <!-- قسم النصوص والتحكم -->
        <div class="content-box">
            <h1>تمام للتقنية</h1>
            <div class="subtitle">tmmam tech</div>
            <div class="line"></div>
            
            <p class="description">
                رحلة شغف وإبداع تدمج بين عالم التقنية الرقمية وهندسة السيارات.
            </p>
            <p class="description">
                هنا تجدون شروحات <span class="highlight">ميكانيك وكهرباء السيارات</span>، البرامج الحديثة، والملخصات الحصرية لطلابنا.
            </p>
            
            <div class="btn-group">
                <a href="about.html" class="btn">👤 من أنا؟</a>
                
                <a href="education.html" class="btn btn-prime">
                    📚 المكتبة والملخصات
                </a>

                <a href="links.html" class="btn">
                    🔗 روابط التواصل
                    <span class="badge">جديد</span>
                </a>
            </div>
        </div>
        
        <div class="footer">
            تصميم وتطوير — <span>tmmam تمام ❤️</span>
        </div>
    </div>

    <!-- كود جافا سكريبت احتياطي للتأكيد التام على تشغيل الفيديو تلقائياً في كل الهواتف -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var video = document.querySelector('.brand-video');
            if (video) {
                video.play().catch(function(error) {
                    console.log("Autoplay caught or prevented: ", error);
                });
            }
        });
    </script>
</body>
</html>
