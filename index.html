<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 🔍 وسوم السيو (SEO) الاحترافية لتهيئة الموقع لمحركات البحث 🔍 -->
    <title>تمام للتقنية | Tmmam Tech - مستقبل الحلول الرقمية</title>
    <meta name="description" content="منصة تمام للتقنية - رحلة شغف وإبداع في عالم الويب، البرامج، والتقنيات الحديثة. استكشف شروحات نادرة وارفع ملفاتك مجاناً عبر سحابتنا الآمنة.">
    <meta name="keywords" content="تمام للتقنية, tmmam tech, استضافة ملفات, رفع ملفات مجاني, مدونة تقنية, شروحات ويب, برامج نادرة">
    <meta name="author" content="tmmam تمام">
    
    <!-- استدعاء خط ألكسندریا المريح وأيقونات Font Awesome -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">

    <style>
        /* 🎨 مصفوفة ألوان السايبربانك والتقنية الفاخرة */
        :root {
            --bg-dark: #07080e;
            --card-bg: rgba(255, 255, 255, 0.02);
            --card-border: rgba(255, 255, 255, 0.06);
            --primary-neon: #00f2fe;
            --secondary-neon: #4facfe;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --success-neon: #25D366;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Alexandria', sans-serif; scroll-behavior: smooth; }
        body { background-color: var(--bg-dark); color: var(--text-main); overflow-x: hidden; position: relative; min-height: 100vh; }

        /* خلفية التوهج التقني المريح للعين */
        .bg-glow-1 { position: absolute; top: -10%; left: -10%; width: 50vw; height: 50vh; background: radial-gradient(circle, rgba(0, 242, 254, 0.1) 0%, transparent 70%); z-index: -1; pointer-events: none; }
        .bg-glow-2 { position: absolute; bottom: 10%; right: -10%; width: 40vw; height: 40vh; background: radial-gradient(circle, rgba(79, 172, 254, 0.08) 0%, transparent 70%); z-index: -1; pointer-events: none; }

        /* 🗺️ شريط التنقل الزجاجي الموحد */
        header {
            position: sticky; top: 0; z-index: 1000; width: 100%;
            background: rgba(7, 8, 14, 0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 8%;
        }
        .logo { font-size: 1.4rem; font-weight: 900; letter-spacing: 0.5px; text-decoration: none; color: #fff; line-height: 1.4; }
        .logo span { color: var(--primary-neon); text-shadow: 0 0 15px rgba(0, 242, 254, 0.3); }
        .logo-arabic { font-size: 0.95rem; font-weight: 400; color: var(--text-muted); display: block; margin-top: 2px; }
        
        nav { display: flex; align-items: center; gap: 10px; }
        nav a { color: var(--text-main); text-decoration: none; padding: 8px 16px; font-weight: 600; font-size: 0.95rem; border-radius: 50px; transition: 0.3s; }
        nav a:hover, nav a.active { color: var(--primary-neon); background: rgba(0, 242, 254, 0.05); }
        .nav-btn { background: linear-gradient(135deg, var(--secondary-neon), var(--primary-neon)); color: #000; font-weight: 700; box-shadow: 0 4px 15px rgba(0, 242, 254, 0.2); }
        .nav-btn:hover { color: #000; background: linear-gradient(135deg, var(--primary-neon), var(--secondary-neon)); transform: translateY(-1px); }

        /* 🏠 قسم واجهة الموقع الرئيسية (Hero Section) */
        section { padding: 6rem 8% 4rem; min-height: 90vh; display: flex; align-items: center; justify-content: center; }
        .hero-container { display: flex; align-items: center; justify-content: space-between; gap: 40px; width: 100%; max-width: 1200px; }
        .hero-content { max-width: 600px; text-align: right; }
        
        .badge { background: rgba(0, 242, 254, 0.08); color: var(--primary-neon); padding: 0.4rem 1.2rem; border-radius: 50px; font-size: 0.85rem; font-weight: 600; border: 1px solid rgba(0, 242, 254, 0.15); display: inline-block; margin-bottom: 1.5rem; }
        h1 { font-size: 3.2rem; font-weight: 900; line-height: 1.3; margin-bottom: 1.5rem; color: #fff; }
        .text-gradient { background: linear-gradient(135deg, var(--primary-neon), var(--secondary-neon)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* 🌌 سلايدر نصوص الشغف عبر الـ CSS النقي المستقر 🌌 */
        .slider-wrapper { position: relative; min-height: 50px; margin-bottom: 2.5rem; overflow: hidden; }
        .slide-item { font-size: 1.2rem; color: var(--text-muted); line-height: 1.7; position: absolute; width: 100%; opacity: 0; animation: pureSlider 16s infinite ease-in-out; }
        .slide-item:nth-child(1) { animation-delay: 0s; }
        .slide-item:nth-child(2) { animation-delay: 4s; }
        .slide-item:nth-child(3) { animation-delay: 8s; }
        .slide-item:nth-child(4) { animation-delay: 12s; }
        @keyframes pureSlider {
            0% { opacity: 0; transform: translateY(10px); }
            5% { opacity: 1; transform: translateY(0); }
            20% { opacity: 1; transform: translateY(0); }
            25% { opacity: 0; transform: translateY(-10px); }
            100% { opacity: 0; }
        }

        .hero-buttons { display: flex; gap: 15px; }
        .btn-main { display: inline-block; padding: 14px 36px; font-size: 1rem; font-weight: 700; border-radius: 12px; text-decoration: none; transition: 0.3s ease; }
        .btn-primary { background: linear-gradient(135deg, var(--secondary-neon), var(--primary-neon)); color: #000; box-shadow: 0 10px 25px rgba(0, 242, 254, 0.15); }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(0, 242, 254, 0.3); }
        .btn-secondary { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-main); backdrop-filter: blur(5px); }
        .btn-secondary:hover { border-color: var(--primary-neon); background: rgba(255,255,255,0.05); }

        /* اللوجو التفاعلي العائم (فيديو) */
        .hero-visual { position: relative; display: flex; align-items: center; justify-content: center; }
        .avatar-video { width: 220px; height: 220px; border-radius: 50%; object-fit: cover; border: 4px solid var(--primary-neon); box-shadow: 0 0 40px rgba(0, 242, 254, 0.25); animation: floatVisual 4s ease-in-out infinite; background-color: #0b0d16; }
        @keyframes floatVisual { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-12px) rotate(2deg); } }

        /* 👤 قسم من أنا؟ (About Section) */
        .section-title { text-align: center; font-size: 2.2rem; font-weight: 900; margin-bottom: 3.5rem; }
        .about-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 24px; padding: 40px; max-width: 800px; margin: 0 auto; backdrop-filter: blur(10px); box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .about-grid { display: grid; grid-template-columns: 1fr; gap: 30px; text-align: center; }
        .bio-text { font-size: 1.2rem; line-height: 2; color: var(--text-main); }
        .highlight { color: var(--primary-neon); font-weight: 600; }
        
        .features-list { list-style: none; display: flex; flex-direction: column; gap: 15px; align-items: center; margin-top: 20px; }
        .features-list li { font-size: 1.1rem; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
        .features-list li i { color: var(--primary-neon); text-shadow: 0 0 10px var(--primary-neon); }

        /* ☁️ قسم سحابة الرفع السحابية (Upload Section) */
        .upload-wrapper { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 24px; padding: 40px 30px; max-width: 600px; margin: 0 auto; width: 100%; backdrop-filter: blur(16px); box-shadow: 0 25px 50px rgba(0,0,0,0.4); text-align: center; }
        .drop-zone { width: 100%; padding: 45px 20px; border: 2px dashed rgba(0, 242, 254, 0.2); border-radius: 18px; background: rgba(10, 11, 16, 0.4); cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; align-items: center; }
        .drop-zone.drag-over { border-color: var(--primary-neon); background: rgba(0, 242, 254, 0.04); box-shadow: 0 0 20px rgba(0, 242, 254, 0.15); }
        .cloud-upload-icon { width: 65px; height: 65px; fill: #9ca3af; margin-bottom: 15px; transition: 0.3s; }
        .drop-zone:hover .cloud-upload-icon { fill: #00f2fe; transform: translateY(-4px); }
        
        .progress-container { margin-top: 25px; width: 100%; display: none; text-align: right; background: rgba(255, 255, 255, 0.01); border: 1px solid rgba(255, 255, 255, 0.04); padding: 15px; border-radius: 12px; }
        .file-info { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: #9ca3af; margin-bottom: 10px; }
        #progress-percent { color: var(--primary-neon); font-weight: 700; }
        .progress-bar-bg { width: 100%; height: 8px; background: rgba(255, 255, 255, 0.05); border-radius: 10px; overflow: hidden; }
        .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--secondary-neon), var(--primary-neon)); border-radius: 10px; box-shadow: 0 0 10px var(--primary-neon); }

        .result-container { margin-top: 25px; background: rgba(37, 211, 102, 0.02); border: 1px solid rgba(37, 211, 102, 0.15); padding: 20px 15px; border-radius: 14px; display: none; }
        .success-svg { width: 30px; height: 30px; fill: #25D366; margin-bottom: 8px; }
        .result-container p { font-size: 0.95rem; font-weight: 600; color: #f3f4f6; margin-bottom: 12px; }
        .link-box { display: flex; background: rgba(10, 11, 16, 0.6); border: 1px solid var(--card-border); border-radius: 8px; overflow: hidden; margin-top: 10px; }
