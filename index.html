<!-- استبدل زر التحميل القديم بهذا الجزء -->
<a href="رابط_ملف_الـ_PDF_هنا" id="downloadLink" class="download-btn" onclick="startDownload(event)">تحميل الكتاب (PDF)</a>

<script>
function startDownload(event) {
    const link = event.currentTarget;
    
    // إذا كان العداد قد انتهى مسبقاً، اسمح بالتحميل المباشر
    if (link.classList.contains('ready')) {
        return true;
    }
    
    // منع التحميل الفوري لتشغيل العداد
    event.preventDefault();
    
    let timeLeft = 5; // عدد الثواني
    link.style.pointerEvents = 'none'; // تعطيل الضغط أثناء العد
    link.style.background = 'linear-gradient(45deg, #555, #333)';
    link.style.color = '#fff';
    
    const timer = setInterval(() => {
        if (timeLeft <= 0) {
            clearInterval(timer);
            link.innerText = "⚡ اضغط الآن للتحميل المباشر";
            link.style.background = "linear-gradient(45deg, #00cb82, #27ae60)"; // لون أخضر للنجاح
            link.style.pointerEvents = 'auto';
            link.classList.add('ready');
        } else {
            link.innerText = `⏳ جاري تجهيز ملف السيارات... (${timeLeft})`;
            timeLeft--;
        }
    }, 1000);
}
</script>
