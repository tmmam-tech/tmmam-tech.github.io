<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تمام للتقنية | tmmam tech</title>
    <!-- استدعاء خط ألكسندریا ليعطي طابعاً تقنياً مريحاً وعصرياً -->
    <link href="https://googleapis.com" rel="stylesheet">

    <style>
        /* إعدادات المتغيرات والألوان النيونية والتقنية المريحة للعين */
        :root {
            --bg-dark: #0a0b10;
            --card-bg: rgba(255, 255, 255, 0.02);
            --card-border: rgba(255, 255, 255, 0.07);
            --primary-neon: #00f2fe;
            --secondary-neon: #4facfe;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        /* تصفير الإعدادات الافتراضية للخطوط والهوامش */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Alexandria', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            position: relative;
            text-align: center;
            min-height: 100vh;
        }

        /* خلفية متوهجة ديناميكية تعطي عمقاً للموقع للمظهر المستقبلي */
        .bg-glow {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.12) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        /* شريط التنقل الزجاجي المرن والمتوافق مع الأجهزة */
        nav {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            padding: 1.2rem 5%;
            background: rgba(10, 11, 16, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            z-index: 100;
            gap: 15px;
        }

        nav a {
            color: var(--text-main);
            text-decoration: none;
            margin: 0 10px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: 0.3s ease;
        }

        nav a:hover {
            color: var(--primary-neon);
        }

        /* حاوية المحتوى الرئيسية الوسطية */
        .container {
            max-width: 750px;
            margin: 60px auto;
            padding: 0 20px;
        }

        /* إعدادات الأفاتار المتحرك (فيديو اللوجو المطور) */
        .avatar-video {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary-neon);
            margin-bottom: 25px;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.25);
            animation: float 3.5s ease-in-out infinite;
            background-color: #0d0f14;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary-neon), var(--secondary-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 25px;
            font-weight: 400;
        }

        .line {
            width: 70px;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-neon), var(--secondary-neon));
            margin: 0 auto 35px;
            border-radius: 10px;
        }

        /* لوحة التأثير الكتابي المعززة زجاجياً */
        .typing-box {
            font-size: 1.25rem;
            color: var(--text-main);
            margin-bottom: 35px;
            min-height: 2.5rem;
            line-height: 1.6;
            padding: 10px 15px;
        }

        .typing-text {
            color: var(--primary-neon);
            font-weight: 600;
        }

        .cursor-blink {
            display: inline-block;
            background: var(--primary-neon);
            width: 2px;
            height: 1.2em;
            margin-right: 4px;
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* الأزرار التفاعلية الأنيقة وعريضة اللمس للـ Mobile */
        .btn {
            display: inline-block;
            background: var(--card-bg);
            border: 1.5px solid var(--card-border);
            color: var(--text-main);
            padding: 14px 36px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            text-decoration: none;
            margin: 10px 8px;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(5px);
        }

        .btn:hover {
            background: linear-gradient(135deg, var(--secondary-neon), var(--primary-neon));
            color: #000;
            border-color: transparent;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 242, 254, 0.2);
        }

        /* صندوق مقالات المدونة الإبداعي والمطوّر */
        .blog-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 35px 25px;
            margin: 50px auto 20px;
            max-width: 550px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            transition: 0.3s;
        }

        .blog-box:hover {
            border-color: rgba(0, 242, 254, 0.3);
            box-shadow: 0 15px 35px rgba(0, 242, 254, 0.04);
        }

        .blog-box p.title {
            color: var(--primary-neon);
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .blog-box p.desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn-blog {
            display: inline-block;
            background: linear-gradient(135deg, var(--secondary-neon), var(--primary-neon));
            color: #000;
            padding: 14px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            transition: 0.3s;
        }

        .btn-blog:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 242, 254, 0.3);
        }

        /* تذييل الصفحة الأنيق */
        .footer {
            margin-top: 60px;
            color: var(--text-muted);
            font-size: 0.9rem;
            padding: 20px 0;
            border-top: 1px solid var(--card-border);
        }

        .footer span {
            color: var(--primary-neon);
            font-weight: 600;
        }

        /* تجاوب تام وسلس مع الهواتف الذكية */
        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .typing-box { font-size: 1.1rem; }
            .btn { width: 100%; margin: 8px 0; }
            nav { padding: 1rem; gap: 10px; }
            nav a { margin: 0 6px; font-size: 0.85rem; }
        }
    </style>
</head>
